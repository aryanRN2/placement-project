{% extends 'base.html' %}

{% block title %}Student Registration | Placement Portal{% endblock %}

{% block content %}
<style>
    /* Override base background just for this page */
    body {
        background-color: #ffffff !important;
        margin: 0;
        overflow-x: hidden;
    }

    #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: auto;
    }

    .login-wrapper {
        border-radius: 1rem;
        padding: 4rem 1rem;
        margin-top: 1rem;
    }

    /* Glassmorphism Card (Matches Index Page) */
    .glass-card {
        background: rgba(255, 255, 255, 0.4) !important;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        border: 1px solid rgba(13, 110, 253, 0.3);
        border-radius: 1.2rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        color: #1a1a1a !important;
        /* Floating Animation */
        animation: floatCard 6s ease-in-out infinite;
    }
    
    .glass-card .text-primary { color: #1a1a1a !important; }
    .glass-card p, .glass-card .form-label { color: #333; font-weight: 500; }

    /* Keyframes for subtle floating animation */
    @keyframes floatCard {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    /* Smooth scaling effect for focused inputs */
    .glass-card .form-control {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #4ea7ec; /* Added the border color you liked! */
        color: #333;
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    
    .glass-card .form-control:focus {
        transform: scale(1.04);
        background: #ffffff;
        box-shadow: 0 0 12px rgba(78, 167, 236, 0.6);
        outline: none;
        border-color: #4ea7ec;
    }

    /* Staggered form elements fade-in */
    .fade-in-stagger {
        opacity: 0;
        animation: fadeInUp 0.8s ease-out forwards;
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .stagger-6 { animation-delay: 0.6s; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Button adjustments for light glass UI */
    .glass-card .btn-primary {
        background: #0d6efd;
        color: #fff;
        border: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
    }

    /* Password Toggle Styles */
    .password-field-container {
        position: relative;
    }
    
    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #6c757d;
        cursor: pointer;
        padding: 0;
        z-index: 10;
        transition: color 0.3s ease;
    }
    
    .password-toggle:hover {
        color: #0d6efd;
    }

    .glass-card .form-control {
        padding-right: 45px;
    }
</style>

<!-- Antigravity Canvas -->
<canvas id="particleCanvas"></canvas>

<div class="login-wrapper">
    <div class="row justify-content-end align-items-center h-100 m-0 pe-md-5 me-md-5">
        <div class="col-md-6 col-lg-5 col-xl-4 z-2" style="position: relative;">
            <div class="card glass-card border-0">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4 text-primary fade-in-stagger stagger-1">Student Registration</h3>
                    <form method="POST" action="{{ url_for('register_student') }}">
                        <div class="mb-3 fade-in-stagger stagger-2">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control rounded-3" id="name" name="name" required>
                        </div>
                        <div class="mb-3 fade-in-stagger stagger-3">
                            <label for="username" class="form-label">Username (Roll No. Preferred)</label>
                            <input type="text" class="form-control rounded-3" id="username" name="username" required>
                        </div>
                        <div class="mb-4 fade-in-stagger stagger-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="password-field-container">
                                <input type="password" class="form-control rounded-3" id="password" name="password" required>
                                <button type="button" class="password-toggle" id="togglePassword">
                                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-grid fade-in-stagger stagger-5 mt-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Register</button>
                        </div>
                    </form>
                    <div class="mt-4 text-center fade-in-stagger stagger-6">
                        <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    window.PARTICLE_SHAPE = 'register';
    
    // Password toggle functionality
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const toggleIcon = document.querySelector('#toggleIcon');

    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // toggle the eye / eye-slash icon
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });
</script>
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
{% endblock %}
