{% extends 'base.html' %}

{% block title %}Student Profile | Placement Portal{% endblock %}

{% block content %}

<style>
    #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: auto;
    }
    
    .glass-card {
        background: rgba(255, 255, 255, 0.4) !important;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        border: 1px solid rgba(13, 110, 253, 0.3);
        border-radius: 1.2rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        color: #1a1a1a !important;
    }

    .glass-card .card-header {
        background: rgba(255, 255, 255, 0.3) !important;
        border-bottom: 1px solid rgba(13, 110, 253, 0.2);
        border-top-left-radius: 1.2rem;
        border-top-right-radius: 1.2rem;
    }
</style>

<!-- Antigravity Canvas -->
<canvas id="particleCanvas"></canvas>

<div class="row justify-content-center z-2" style="position: relative;">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mb-4 glass-card">
            <div class="card-header text-primary"><h4 class="mb-0">Edit Profile</h4></div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('student_profile') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ current_user.student_profile.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contact Info (Phone/Email)</label>
                        <input type="text" class="form-control" name="contact" value="{{ current_user.student_profile.contact or '' }}">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Resume Upload (PDF preferred)</label>
                        {% if current_user.student_profile.resume_path %}







                            <div class="mb-2">
                                <a href="{{ url_for('static', filename=current_user.student_profile.resume_path.replace('static/', '')) }}" target="_blank" class="btn btn-sm btn-info">View Current Resume</a>
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="resume" accept=".pdf,.doc,.docx">

                        <small class="text-muted">Upload a new resume to replace the existing one.</small>
                        
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>window.PARTICLE_SHAPE = 'default';</script>
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
{% endblock %}
