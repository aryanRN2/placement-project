{% extends 'base.html' %}

{% block title %}Student Profile | Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white text-primary"><h4 class="mb-0">Edit Profile</h4></div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('student_profile') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ current_user.student_profile.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contact Info (Phone/Email)</label>
                        <input type="text" class="form-control" name="contact" value="{{ current_user.student_profile.contact or '' }}">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Resume Upload (PDF preferred)</label>
                        {% if current_user.student_profile.resume_path %}







                            <div class="mb-2">
                                <a href="{{ url_for('static', filename=current_user.student_profile.resume_path.replace('static/', '')) }}" target="_blank" class="btn btn-sm btn-info">View Current Resume</a>
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="resume" accept=".pdf,.doc,.docx">

                        <small class="text-muted">Upload a new resume to replace the existing one.</small>
                        
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
