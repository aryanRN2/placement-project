{% extends 'base.html' %}

{% block title %}Login | Placement Portal{% endblock %}

{% block content %}
<style>
    /* Gradient Background for the login wrapper to make glassmorphism pop! */
    .login-wrapper {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        border-radius: 1rem;
        padding: 4rem 1rem;
        margin-top: 1rem;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
    }

    /* Glassmorphism Card */
    .glass-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 1.2rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
        color: #fff;
        /* Floating Animation */
        animation: floatCard 6s ease-in-out infinite;
    }
    
    .glass-card .text-primary {
        color: #fff !important; 
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    
    .glass-card p, .glass-card .form-label {
        color: #f8f9fa;
        font-weight: 500;
    }

    /* Keyframes for subtle floating animation */
    @keyframes floatCard {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    /* Smooth scaling effect for focused inputs */
    .glass-card .form-control {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #333;
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    
    .glass-card .form-control:focus {
        transform: scale(1.04);
        background: #ffffff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        outline: none;
        border-color: rgba(255, 255, 255, 0.9);
    }

    /* Staggered form elements fade-in */
    .fade-in-stagger {
        opacity: 0;
        animation: fadeInUp 0.8s ease-out forwards;
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.3s; }
    .stagger-3 { animation-delay: 0.5s; }
    .stagger-4 { animation-delay: 0.7s; }
    .stagger-5 { animation-delay: 0.9s; }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Button adjustments for glass UI */
    .glass-card .btn-primary {
        background: linear-gradient(135deg, #0cebeb 0%, #20e3b2 50%, #29ffc6 100%);
        color: #000;
        border: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(41, 255, 198, 0.4);
    }
    
    .glass-card .btn-outline-secondary {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
    }
    .glass-card .btn-outline-secondary:hover {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        border-color: #fff;
        transform: scale(1.05);
    }
</style>

<div class="login-wrapper">
    <div class="row justify-content-center m-0">
        <div class="col-md-7 col-lg-6 col-xl-5">
            <div class="card glass-card border-0">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4 text-primary fade-in-stagger stagger-1">Login</h3>
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3 fade-in-stagger stagger-2">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control rounded-3" id="username" name="username" required>
                        </div>
                        <div class="mb-4 fade-in-stagger stagger-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control rounded-3" id="password" name="password" required>
                        </div>
                        <div class="d-grid fade-in-stagger stagger-4 mt-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Login</button>
                        </div>
                    </form>
                    <div class="mt-4 text-center fade-in-stagger stagger-5">
                        <p class="mb-3">Don't have an account?</p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{{ url_for('register_student') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Register Student</a>
                            <a href="{{ url_for('register_company') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Register Company</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
