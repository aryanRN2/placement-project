{% extends 'base.html' %}

{% block title %}Welcome | Placement Portal{% endblock %}

{% block content %}
<style>
    /* Override base background just for the homepage */
    body {
        background-color: #ffffff !important;
        margin: 0;
        overflow-x: hidden;
    }

    /* Make the blue box transparent to see particles behind it */
    .hero-section {
        background: rgba(255, 255, 255, 0.2) !important;
        /* Light transparent glass */
        backdrop-filter: blur(1px);
        /* Low blur so dots are still visible */
        -webkit-backdrop-filter: blur(3px);
        border: 1px solid rgba(144, 146, 149, 0.3);
        /* Subtle blue edge */
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        color: #1a1a1a !important;
        /* Dark text for readability */
    }

    #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: auto;
        /* Allow canvas to receive mouse events */
    }
</style>

<!-- Antigravity Canvas -->
<canvas id="particleCanvas"></canvas>

<div class="text-center hero-section" style="position: relative; z-index: 1;">
    <h1 class="display-4 fw-bold">Welcome to the Institute Placement Portal</h1>
    <p class="lead mt-3">Connecting brilliant minds with outstanding opportunities.</p>
    <div class="mt-4">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-4 me-2">Login</a>
        <a href="{{ url_for('register_student') }}" class="btn btn-outline-primary btn-lg px-4 me-2">Student
            Register</a>
        <a href="{{ url_for('register_company') }}" class="btn btn-outline-primary btn-lg px-4">Company Register</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
{% endblock %}
